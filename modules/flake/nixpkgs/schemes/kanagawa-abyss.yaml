system: "base16"
name: "Kanagawa Abyss"
author: "Tommaso Laurenzi (https://github.com/rebelot)"
variant: "dark"
palette:
  base00: "#181616" # Black (Background)         | Default Background |
  base01: "#1D1C19" # (Darkest Gray)             | Lighter Background (Used for status bars) |
  base02: "#393836" # (Dark Gray)                | Selection Background |
  base03: "#4A4947" # Bright Black (Gray)        | Comments, Invisibles, Line Highlighting |
  base04: "#727169" # (Light Gray)               | Dark Foreground (Used for status bars) |
  base05: "#DCD7BA" # White                      | Default Foreground, Caret, Delimiters, Operators |
  base06: "#C8C093" # (Lighter White)            | Light Foreground |
  base07: "#717C7C" # Bright White               | The Lightest Foreground |
  base08: "#FF5D62" # Red and Bright Red         | Variables, XML Tags, Markup Link Text, Markup Lists, Diff Deleted |
  base09: "#FFA066" # (Orange)                   | Integers, Boolean, Constants, XML Attributes, Markup Link Url |
  base0A: "#E6C384" # Yellow and Bright Yellow   | Classes, Markup Bold, Search Text Background |
  base0B: "#98BB6C" # Green and Bright Green     | Strings, Inherited Class, Markup Code, Diff Inserted |
  base0C: "#7AA89F" # Cyan and Bright Cyan       | Support, Regular Expressions, Escape Characters, Markup Quotes |
  base0D: "#7E9CD8" # Blue and Bright Blue       | Functions, Methods, Attribute IDs, Headings |
  base0E: "#957FB8" # Magenta and Bright Magenta | Keywords, Storage, Selector, Markup Italic, Diff Changed |
  base0F: "#D27E99" # (Dark Red or Brown)        | Deprecated, Opening/Closing Embedded Language Tags, e.g. `<?php ?>` |
